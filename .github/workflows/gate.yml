name: gate

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm format:check

      - run: pnpm check:links

      - run: pnpm check:quotes

      # verbose prints per-test durations: a timeout on a slower runner names
      # itself here instead of needing the raw log.
      - run: pnpm test --run --reporter=verbose

      # Placeholders: the build needs the Payload config to be loadable, not a
      # reachable database. It logs one ECONNREFUSED because the static
      # not-found page asks the content source, and it exits 0 — that log is
      # the error reporter doing its job, not a failing step.
      - run: pnpm exec next build
        env:
          DATABASE_URL: postgres://user:pass@localhost:5432/placeholder
          PAYLOAD_SECRET: placeholder-secret-for-the-build
          NEXT_PUBLIC_SERVER_URL: http://localhost:3000

  # The gate above verifies the foundation, which is a shape nobody ships. This
  # verifies the ones that do: a generated project per provider. It is the net
  # that was missing - every provider-shaped defect was invisible until someone
  # ran the loop by hand.
  shapes:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        provider: [payload, api, mock]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate a ${{ matrix.provider }} project
        run: pnpm exec tsx scripts/create/Create.cli.ts ../shape --provider=${{ matrix.provider }} --yes

      # Not --frozen-lockfile: the generated package.json declares fewer
      # dependencies than the copied lockfile describes.
      - run: pnpm install --no-frozen-lockfile
        working-directory: ../shape

      - run: pnpm lint
        working-directory: ../shape

      - run: pnpm typecheck
        working-directory: ../shape

      - run: pnpm check:links
        working-directory: ../shape

      - run: pnpm check:quotes
        working-directory: ../shape
